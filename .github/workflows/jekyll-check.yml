# Temporary: build the site with the same Jekyll GitHub Pages uses, to read the log. Deploys nothing.
name: jekyll-check
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
